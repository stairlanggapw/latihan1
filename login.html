<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Masuk | Aduan Warga</title>
	<style>
		:root {
			--navy: #12304a;
			--blue: #2474a6;
			--blue-light: #eaf5fb;
			--cream: #f7f9f5;
			--text: #20313d;
			--muted: #6d7c84;
			--line: #d7e2e6;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: linear-gradient(135deg, var(--cream), var(--blue-light));
			color: var(--text);
			font-family: Georgia, "Times New Roman", serif;
		}

		.login-page {
			width: min(100%, 980px);
			display: grid;
			grid-template-columns: 0.9fr 1.1fr;
			overflow: hidden;
			background: #ffffff;
			border: 1px solid rgba(18, 48, 74, 0.1);
			border-radius: 12px;
			box-shadow: 0 18px 50px rgba(18, 48, 74, 0.14);
		}

		.intro {
			display: flex;
			flex-direction: column;
			justify-content: center;
			padding: 52px 44px;
			background: var(--navy);
			color: #ffffff;
		}

		.badge {
			width: 48px;
			height: 48px;
			display: grid;
			place-items: center;
			margin-bottom: 28px;
			border-radius: 50%;
			background: #f0bf59;
			color: var(--navy);
			font-size: 24px;
			font-weight: bold;
		}

		.intro h1 {
			max-width: 300px;
			margin: 0 0 16px;
			font-size: clamp(2rem, 4vw, 3rem);
			line-height: 1.05;
		}

		.intro p {
			max-width: 310px;
			margin: 0;
			color: #dceaf0;
			font-family: Arial, sans-serif;
			line-height: 1.7;
		}

		.form-area {
			padding: 52px clamp(28px, 6vw, 72px);
		}

		.form-area h2 {
			margin: 0 0 8px;
			color: var(--navy);
			font-size: 2rem;
		}

		.subtitle {
			margin: 0 0 30px;
			color: var(--muted);
			font-family: Arial, sans-serif;
			font-size: 0.95rem;
		}

		form {
			display: grid;
			gap: 18px;
		}

		label {
			display: grid;
			gap: 8px;
			color: var(--navy);
			font-family: Arial, sans-serif;
			font-size: 0.9rem;
			font-weight: bold;
		}

		input {
			width: 100%;
			padding: 13px 14px;
			border: 1px solid var(--line);
			border-radius: 6px;
			color: var(--text);
			font: inherit;
			outline: none;
		}

		input:focus {
			border-color: var(--blue);
			box-shadow: 0 0 0 3px rgba(36, 116, 166, 0.14);
		}

		.form-options {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			font-family: Arial, sans-serif;
			font-size: 0.85rem;
		}

		.remember {
			display: flex;
			grid-template-columns: none;
			align-items: center;
			gap: 8px;
			color: var(--muted);
			font-weight: normal;
		}

		.remember input {
			width: auto;
			accent-color: var(--blue);
		}

		a {
			color: var(--blue);
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
		}

		button {
			margin-top: 6px;
			padding: 14px 18px;
			border: 0;
			border-radius: 6px;
			background: var(--blue);
			color: #ffffff;
			cursor: pointer;
			font: bold 0.95rem Arial, sans-serif;
		}

		button:hover {
			background: #1b5d87;
		}

		.register {
			margin: 24px 0 0;
			color: var(--muted);
			font-family: Arial, sans-serif;
			font-size: 0.9rem;
			text-align: center;
		}

		@media (max-width: 700px) {
			body {
				padding: 14px;
			}

			.login-page {
				grid-template-columns: 1fr;
			}

			.intro {
				padding: 32px 28px;
			}

			.badge {
				margin-bottom: 18px;
			}

			.intro h1 {
				font-size: 2.2rem;
			}

			.form-area {
				padding: 34px 28px;
			}
		}
	</style>
</head>
<body>
	<main class="login-page">
		<section class="intro" aria-labelledby="page-title">
			<div class="badge" aria-hidden="true">AW</div>
			<h1 id="page-title">Suara Anda, perubahan kita.</h1>
			<p>Sampaikan laporan dan aspirasi untuk membantu membangun lingkungan yang lebih baik.</p>
		</section>

		<section class="form-area" aria-labelledby="login-title">
			<h2 id="login-title">Selamat datang</h2>
			<p class="subtitle">Masuk untuk melanjutkan ke laman Aduan Warga.</p>

			<form action="#" method="post">
				<label for="identity">
					Email atau NIK
					<input id="identity" name="identity" type="text" placeholder="Masukkan email atau NIK" required>
				</label>

				<label for="password">
					Kata sandi
					<input id="password" name="password" type="password" placeholder="Masukkan kata sandi" required>
				</label>

				<div class="form-options">
					<label class="remember" for="remember">
						<input id="remember" name="remember" type="checkbox">
						Ingat saya
					</label>
					<a href="#lupa-kata-sandi">Lupa kata sandi?</a>
				</div>

				<button type="submit">Masuk ke akun</button>
			</form>

			<p class="register">Belum punya akun? <a href="#daftar">Daftar sekarang</a></p>
		</section>
	</main>
</body>
</html>
